<!DOCTYPE html>
<html>
<head>
<title>Matside Management</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* GLOBAL */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #081633;
    color: white;
    line-height: 1.6;
}
.section { padding: 60px 20px; max-width: 1100px; margin: auto; }

/* NAVBAR */
.navbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    background: #ff7a00;
    padding: 15px 30px;
    position: sticky;
    top: 0;
    z-index: 100;
}
.logo { flex: 1; font-weight: bold; }
.nav-links { flex: 2; display: flex; justify-content: center; gap: 20px; }
.nav-links a { color: white; text-decoration: none; font-weight: bold; }
.social { flex: 1; display: flex; justify-content: flex-end; }
.social a { color: white; font-size: 20px; }

/* HERO */
.hero { text-align: center; padding: 80px 20px 50px; }
.hero img { max-width: 420px; width: 90%; }
.hero p { color: #ccc; }

/* GALLERY */
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.gallery-item {
    overflow: hidden;
    border-radius: 10px;
    cursor: pointer;
}
.gallery-item img {
    width: 100%;
    transition: 0.3s;
}
.gallery-item:hover img {
    transform: scale(1.05);
}

/* LIGHTBOX */
.lightbox {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
}
.lightbox img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 10px;
}

</style>
</head>

<body>

<!-- NAV -->
<div class="navbar">
    <div class="logo">Matside Management</div>
    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#events">Events</a>
        <a href="#equipment">Equipment</a>
    </div>
    <div class="social">
        <a href="https://www.facebook.com/profile.php?id=61561997815902" target="_blank">
            <i class="fab fa-facebook-f"></i>
        </a>
    </div>
</div>

<!-- HERO -->
<div class="hero">
    <img src="logo.jpg">
    <p>Full-Service Wrestling Tournament Operations & Digital Display Solutions</p>
</div>

<!-- EVENTS -->
<div class="section" id="events">
    <h2>Past Events</h2>

    <div class="gallery-grid">
        <div class="gallery-item"><img src="PE1.jpg"></div>
        <div class="gallery-item"><img src="PE2.HEIC"></div>
        <div class="gallery-item"><img src="PE3.HEIC"></div>
        <div class="gallery-item"><img src="PE4.HEIC"></div>
        <div class="gallery-item"><img src="PE5.JPG"></div>
        <div class="gallery-item"><img src="PE6.HEIC"></div>
        <div class="gallery-item"><img src="PE7.JPG"></div>
    </div>
</div>

<!-- EQUIPMENT -->
<div class="section" id="equipment">
    <h2>Equipment</h2>

    <div class="gallery-grid">
        <div class="gallery-item"><img src="Equipment1.png"></div>
        <div class="gallery-item"><img src="Equipment2.PNG"></div>
    </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
    <img id="lightbox-img">
</div>

<script>
// Lightbox logic
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

document.querySelectorAll('.gallery-item img').forEach(img => {
    img.addEventListener('click', () => {
        lightbox.style.display = 'flex';
        lightboxImg.src = img.src;
    });
});

// Close on click anywhere
lightbox.addEventListener('click', () => {
    lightbox.style.display = 'none';
});
</script>

</body>
</html>
